# Päivittää aineistotiedostojen (data/*.json) "updated"-kentän (sivun "Viimeksi päivitetty") sen päivän mukaan,
# jolloin kyseistä tiedostoa viimeksi muutettiin. Ajetaan aina, kun main-haaraan pushataan muutos data-kansioon.
name: Päivitysaika

on:
  push:
    branches: [main]
    paths: ['data/**.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paivitysaika
  cancel-in-progress: false

jobs:
  paivita:
    # Oma aikaleimacommit ei käynnistä työnkulkua uudelleen (GITHUB_TOKEN), tämä on lisävarmistus.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aseta päivämäärät viimeisimmistä muutoksista
        env:
          TZ: Europe/Helsinki
        run: |
          for F in data/*.json; do
            grep -q '^"updated": ' "$F" || continue
            D=$(git log -1 --format=%cd --date=format-local:%Y-%m-%d -- "$F")
            echo "$F: $D"
            sed -i -E "s/^\"updated\": \"[0-9]{4}-[0-9]{2}-[0-9]{2}\"/\"updated\": \"$D\"/" "$F"
            grep -q "^\"updated\": \"$D\"" "$F" || { echo "updated-kenttää ei löytynyt tiedostosta $F"; exit 1; }
          done

      - name: Tallenna muutos
        run: |
          if git diff --quiet data; then
            echo "Aikaleimat ovat jo ajan tasalla."
            exit 0
          fi
          D=$(TZ=Europe/Helsinki date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Päivitä aikaleima $D"
          git push
